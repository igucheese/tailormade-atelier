plugins {
    id 'com.gradleup.shadow'
}


architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

configurations {
    configureEach {
        resolutionStrategy {
            force 'org.ow2.asm:asm-commons:9.10.1'
            force 'org.ow2.asm:asm:9.10.1'
            force 'org.ow2.asm:asm-tree:9.10.1'
            force 'org.ow2.asm:asm-util:9.10.1'
            force 'org.ow2.asm:asm-analysis:9.10.1'
        }
    }
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowCommon project(path: ':common', configuration: 'transformProductionFabric')
}

sourceSets {
    main {
        resources {
            srcDirs += [
                    project(":common").sourceSets.main.resources.srcDirs
            ]
        }
    }
}

processResources {
    def expandProps = [
            "mod_id"                  : project.mod_id,
            "mod_version"             : project.version,
            "mod_name"                : project.mod_name,
            "mod_license"             : project.mod_license,
            "fabric_loader_version"   : rootProject.fabric_loader_version,
            "fabric_minecraft_version_range": rootProject.fabric_minecraft_version_range
    ]
    inputs.properties(expandProps)
    filesMatching("fabric.mod.json") {
        expand(expandProps)
    }
}
shadowJar {
    exclude "architectury.common.json"
    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set("dev-shadow")
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier.set(null)
}

jar {
    archiveClassifier.set("dev")
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
